use-conda: true
printshellcmds: true
keep-going: false
rerun-incomplete: true

cores: 192

resources:
  - mem_mb=512000
  - cpus_per_task=192
  - uses_gpu=4

default-resources:
  - runtime=2h
  - cpus_per_task=1
  - mem_mb=4096
  - mem_per_cpu=4096

set-resources:
  run_alphafast:
    mem_mb: 128000
    cpus_per_task: 32
    uses_gpu: 4

  map_prediction_to_structure:
    mem_mb: 64000
    cpus_per_task: 32

  get_and_plot_metrics:
    mem_mb: 16000
    cpus_per_task: 2

  project_screen:
    cpus_per_task: 2

set-threads:
  run_alphafast: 32
  map_prediction_to_structure: 32
  get_and_plot_metrics: 2
  project_screen: 2
