jobs: 500
use-conda: true
printshellcmds: false
keep-going: false
keep-incomplete: false
rerun-incomplete: true
rerun-triggers:
  - mtime
  - params

cores: 48

resources:
  - mem_mb=256000
  - cpus_per_task=48
  - uses_gpu=1
  - api_requests=4
  - af_batch_slots=1

default-resources:
  - runtime=2h
  - cpus_per_task=1
  - mem_mb=4096

set-resources:
  run_alphafast:
    runtime: "240h"
    mem_mb: 256000
    cpus_per_task: 32
    uses_gpu: 4

  make_master_fasta:
    mem_mb: 16000
    api_requests: 1

  map_prediction_to_structure:
    mem_mb: 64000
    cpus_per_task: 16

  get_and_plot_metrics:
    mem_mb: 16000
    cpus_per_task: 16

  project_screen:
    cpus_per_task: 4

set-threads:
  run_alphafast: 32
  map_prediction_to_structure: 16
  get_and_plot_metrics: 16
  project_screen: 4
