jobs: 500
use-conda: true
printshellcmds: false
keep-going: true
keep-incomplete: false
rerun-incomplete: true
rerun-triggers:
  - input
  - mtime
  - params
quiet:
  - rules

cores: 384

resources:
  - mem_mb=2048000
  - n_gpu=8
  - api_requests=1
  - af_batch_slots=1

default-resources:
  - runtime=2h
  - mem_mb=4096

set-resources:
  run_alphafast_batch:
    runtime: "240h"
    mem_mb: 256000
    n_gpu: 8
    af_batch_slots: 1
  map_prediction_to_structure:
    mem_mb: 16000
  get_and_plot_metrics:
    mem_mb: 16000

set-threads:
  run_alphafast_batch: 32
  map_prediction_to_structure: 32
  get_and_plot_metrics: 32
  project_screen: 8
