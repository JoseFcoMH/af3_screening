executor: slurm
jobs: 40
use-conda: true
printshellcmds: true
keep-going: true
rerun-incomplete: true

threads: 24

resources:
  - mem_mb=512000
  - cpus_per_task=24
  - uses_gpu=1

default-resources:
  - runtime=360
  - cpus_per_task=1
  - mem_per_cpu=4096

set-resources:
  alphafast:
    mem_mb: 256000
    cpus_per_task: 8
    runtime: 8000
    uses_gpu: 1
    slurm_extra: "-p gpuqueue --gres=gpu:1"

  map_prediction_to_structure:
    mem_mb: 64000
    cpus_per_task: 8
    runtime: 180

  get_and_plot_metrics:
    mem_mb: 16000
    cpus_per_task: 2
    runtime: 60

  apply_defattr:
    runtime: 60
    mem_mb: 4000

  project_screen:
    mem_mb: 4000
    cpus_per_task: 2
    runtime: 60

set-threads:
  alphafast: 8
  map_prediction_to_structure: 8
  get_and_plot_metrics: 2
  project_screen: 2

modules:
  apply_defattr:
    - miniconda/latest
    - libxscrnsaver/1.0.0
    - chimerax/1.3

  run_alphafast:
    - singularity/3.8.0
    - apptainer
