jobs: 500
use-conda: true
printshellcmds: false
keep-going: true
keep-incomplete: false
rerun-incomplete: true
rerun-triggers:
  - input
  - mtime
  - params
quiet:
  - rules

cores: 384

resources:
  - mem_mb=2048000
  - cpus_per_task=384
  - uses_gpu=8
  - api_requests=4
  - af_batch_slots=1

default-resources:
  - runtime=2h
  - cpus_per_task=1
  - mem_mb=4096

set-resources:
  run_alphafast:
    runtime: "240h"
    mem_mb: 512000
    cpus_per_task: 32
    uses_gpu: 8
    af_batch_slots: 1

  make_master_fasta:
    mem_mb: 16000
    api_requests: 1

  map_prediction_to_structure:
    mem_mb: 64000
    cpus_per_task: 16

  get_and_plot_metrics:
    mem_mb: 32000
    cpus_per_task: 32

  project_screen:
    cpus_per_task: 4

set-threads:
  run_alphafast: 32
  map_prediction_to_structure: 16
  get_and_plot_metrics: 32
  project_screen: 4


